<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvtoMarkaz — Avtomobil e'lonlari portali</title>
    <meta
      name="description"
      content="O'zbekiston bo'ylab avtomobillarni qulay sotish va xarid qilish uchun zamonaviy e'lonlar platformasi."
    />
    <meta property="og:title" content="AvtoMarkaz — Avtomobil e'lonlari portali" />
    <meta
      property="og:description"
      content="O'zbekiston bo'ylab avtomobillarni qulay sotish va xarid qilish uchun zamonaviy e'lonlar platformasi."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('avtomarkaz_theme');
          if (
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-zinc-950 text-zinc-950 dark:text-zinc-100 antialiased selection:bg-blue-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
